<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống đang bảo trì - Quản lý Bán trú THPT Lê Thị Hồng Gấm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justifyContent: center;
      align-items: center;
      background: #ffffff;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1e293b;
      padding: 32px 16px;
    }
    .card {
      max-width: 520px; width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    .img-wrap {
      max-width: 340px; width: 100%; margin: 0 auto 16px;
      display: flex; justify-content: center; align-items: center;
    }
    .img-wrap img {
      max-width: 100%; max-height: 220px; object-fit: contain; display: block;
    }
    .school-name {
      font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
      color: #64748b; font-weight: 700; margin-bottom: 6px;
    }
    .title {
      font-size: 1.6rem; font-weight: 800; line-height: 1.35;
      color: #0f172a; margin-bottom: 12px;
    }
    .desc {
      font-size: 0.98rem; line-height: 1.6; color: #475569;
      margin-bottom: 20px;
    }
    .time-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 10px 18px; margin-bottom: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 0.9rem; color: #475569;
    }
    .btn {
      width: 100%; max-width: 280px; padding: 11px 22px;
      border-radius: 8px; border: none;
      background: #009CFF;
      color: #ffffff; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center;
      justify-content: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 156, 255, 0.25);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #0088e0;
    }
    .footer {
      margin-top: 24px; font-size: 0.82rem; color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="img-wrap">
      <img src="/bao-tri.jpg" alt="Hệ thống đang bảo trì">
    </div>

    <div class="school-name">TRƯỜNG THPT LÊ THỊ HỒNG GẤM</div>
    <h1 class="title">Hệ thống đang bảo trì vui lòng quay lại sau.</h1>

    <p class="desc">
      Hệ thống Quản lý Bán trú đang được bảo trì và nâng cấp định kỳ. Quý Thầy Cô vui lòng quay lại sau ít phút!
    </p>

    <div class="time-box">
      <i class="far fa-clock" style="color: #d97706;"></i>
      <span>Thời gian dự kiến: <strong style="color: #b45309;">15 - 30 phút</strong></span>
    </div>

    <div>
      <button class="btn" onclick="window.location.reload();">
        <i class="fas fa-sync-alt"></i> Tải lại trang
      </button>
    </div>
  </div>

  <div class="footer">
    Bộ phận Quản lý Bán trú • Năm học 2026-2027
  </div>
</body>
</html>
